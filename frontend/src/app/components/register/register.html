<div class="register-wrapper">
  <div class="register-card">
    <div class="brand-header">
      <div class="brand-logo">🎮</div>
      <h2>Bienvenido a AssetMania</h2>
      <p class="brand-subtitle">Crea tu cuenta para explorar y subir recursos 3D, texturas, VFX y mas.</p>
    </div>

    @if (errorMensaje()) {
      <div class="error-banner">
        <span class="error-icon">⚠️</span>
        <span>{{ errorMensaje() }}</span>
      </div>
    }

    <div class="register-form">
      <button type="button" (click)="onSubmit()" class="btn-primary" [disabled]="isCargando()">
        @if (isCargando()) {
          <span class="spinner"></span>
          <span>Creando cuenta...</span>
        } @else {
          <span>Registrarse en la plataforma</span>
        }
      </button>
    </div>

    <div class="card-footer">
      <p>¿Ya tienes una cuenta creada? <a routerLink="/login">Inicia sesión aquí.</a></p>
    </div>
  </div>
</div>
