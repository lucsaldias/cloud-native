<div class="login-wrapper">
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo">👾</div>
      <h2>Bienvenido a AssetMania</h2>
      <p class="brand-subtitle">Ingresa tus datos nuevamente para acceder al catalogo.</p>
    </div>

    @if (errorMensaje()) {
      <div class="error-banner">
        <span class="error-icon">⚠️</span>
        <span>{{ errorMensaje() }}</span>
      </div>
    }

    <div class="login-form">
      <button type="button" (click)="onSubmit()" class="btn-primary" [disabled]="isCargando()">
        @if (isCargando()) {
          <span class="spinner"></span>
          <span>Iniciando sesión...</span>
        } @else {
          <span>Iniciar Sesion con Microsoft</span>
        }
      </button>
    </div>

    <div class="card-footer">
      <p>¿Aun no tienes cuenta? <a routerLink="/register">Registrate aqui, vro.</a></p>
    </div>
  </div>
</div>
